---

- name: Rollback - Stop Apache service
  tags: rollback
  ansible.builtin.service:
    name: "{{ 'httpd' if ansible_facts['os_family'] == 'RedHat' else 'apache2' }}"
    state: stopped

- name: Rollback - Remove Apache default html file
  tags: rollback
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: absent