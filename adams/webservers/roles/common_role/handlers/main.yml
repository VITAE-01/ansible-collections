---

- name: Include OS-specific variables
  tags: deploy
  ansible.builtin.include_vars:
    file: "{{ ansible_os_family }}.yml"

- name: Restart services on Debian based systems
  tags: deploy
  listen: deb service restart
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ deb_services }}"
  when: deb_services is defined


- name: Restart services on RedHat based systems
  tags: deploy
  listen: redhat service restart
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ redhat_services }}"
  when: redhat_services is defined